services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: digital_library_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER_NAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-database}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_NAME:-postgres} -d ${DB_NAME:-database}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js API Backend
  api:
    container_name: digital_library_api
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER_NAME:-postgres}:${DB_PASSWORD:-root}@postgres:5432/${DB_NAME:-database}?schema=public
      JWT_SECRET: ${JWT_SECRET:-digital_library_super_secret_jwt_key_2026}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TMVbXTNo5SXbh7}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-6ooDs9TOqeu3j26qP0brEaKK}
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - uploads_data:/app/apps/api/uploads
      - secure_uploads_data:/app/apps/api/secure_uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Public Website Frontend
  website:
    container_name: digital_library_website
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    ports:
      - "${WEBSITE_PORT:-3000}:80"
    depends_on:
      - api

  # Admin Portal Frontend
  admin:
    container_name: digital_library_admin
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
  secure_uploads_data:
